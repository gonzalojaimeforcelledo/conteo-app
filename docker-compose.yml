# Frontend independiente. El backend corre en su propio proyecto/servidor.
#   API_URL=https://api.tudominio.pe docker compose up -d --build
services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-https://conteo-backend-production-3650.up.railway.app}
    ports:
      - "8081:80"
